apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphql-taskservice
  namespace: default
  labels:
    app: graphql-taskservice
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: graphql-taskservice
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: graphql-taskservice
        version: "1.0.0"
    spec:
      # Run as non-root (mirrors Dockerfile USER)
      securityContext:
        runAsNonRoot: true

      containers:
        - name: api
          image: graphql-taskservice:1.0.0   # replace with your registry path
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: PYTHONUNBUFFERED
              value: "1"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

      terminationGracePeriodSeconds: 30
