apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: graphql-taskservice
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: taskservice.local          # override for your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: graphql-taskservice
                port:
                  name: http
